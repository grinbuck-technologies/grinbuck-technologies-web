<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="1040" height="260">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&amp;display=swap');
    </style>
    <linearGradient id="qGradCAE" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7a0010"/>
          <stop offset="20%" stop-color="#C8102E"/>
          <stop offset="40%" stop-color="#e86060"/>
          <stop offset="50%" stop-color="#ffffff"/>
          <stop offset="60%" stop-color="#e03030"/>
          <stop offset="75%" stop-color="#C8102E"/>
          <stop offset="88%" stop-color="#ff9999"/>
          <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pGradCAE" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7a0010"/>
          <stop offset="22%" stop-color="#C8102E"/>
          <stop offset="42%" stop-color="#e86060"/>
          <stop offset="50%" stop-color="#ffffff"/>
          <stop offset="60%" stop-color="#e03030"/>
          <stop offset="78%" stop-color="#C8102E"/>
          <stop offset="100%" stop-color="#7a0010"/>
    </linearGradient>
  </defs>
  <!-- QP -->
  <text x="20" y="98"
        font-family="Cormorant Garamond, Georgia, serif"
        font-weight="600" font-size="85"
        fill="url(#qGradCAE)">Q</text>
  <text x="100" y="98"
        font-family="Cormorant Garamond, Georgia, serif"
        font-weight="600" font-size="85"
        fill="url(#pGradCAE)">P</text>
  <!-- divider -->
  <line x1="195" y1="20" x2="195" y2="110"
        stroke="rgba(200,16,46,0.55)" stroke-width="1"/>
  <!-- company name -->
  <text x="215" y="68"
        font-family="Cormorant Garamond, Georgia, serif"
        font-weight="300" font-size="28"
        letter-spacing="3"
        fill="#d0d0d0"><tspan fill="#C8102E">Quintet</tspan> <tspan fill="#C8102E">Ventures</tspan></text>
  <!-- country tag -->
  <text x="216" y="92"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-weight="400" font-size="10"
        letter-spacing="5"
        fill="#C8102E">CANADA INC.</text>
</svg>